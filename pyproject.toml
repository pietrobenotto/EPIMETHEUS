[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epimetheus"
version = "0.3.0"
description = "Effective PSF inferred from mosaics. A customizable python library that manage fro star extraction to star selection, orientation measurements and stacking."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pietro Benotto", email = "pietro.benotto@inaf.it"}
]
requires-python = ">=3.10"

# Python dependencies - these get installed automatically
dependencies = [
    "numpy>=2.1.3",
    "astropy>=5.0",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "photutils>=1.5",
    "scikit-image>=0.19",
    "astroquery>=0.4",
    "tqdm>4.60",
    "drizzle>2",
    "ipython",
    "ipywidgets"
]

[tool.setuptools.packages.find]
where = ["."]